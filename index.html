<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Babylon.js - Space Skybox with Sun & Earth Orbit</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #000;
      }
      #renderCanvas {
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #objectSelector {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 100;
        padding: 5px;
        font-size: 16px;
      }
    </style>
  </head>

  <body>
    <canvas id="renderCanvas"></canvas>

    <select id="objectSelector" onchange="onObjectChange(this.value)">
      <option value="sun">Sun</option>
      <option value="earth">Earth</option>
      <option value="moon">Moon</option>
      <option value="mercury">Mercury</option>
      <option value="venus">Venus</option>
    </select>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <!-- Thư viện đọc file GLB/GLTF -->
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script>
      let camera = null;
      let sunModel = null;
      let earthModel = null;
      let moonModel = null;
      let mercuryModel = null;
      let venusModel = null;
      const onObjectChange = (selectedObject) => {
        if (selectedObject === "sun" && sunModel) {
          camera.setTarget(sunModel.position);
        } else if (selectedObject === "earth" && earthModel) {
          camera.setTarget(earthModel.position);
        } else if (selectedObject === "moon" && moonModel) {
          camera.setTarget(moonModel.position);
        } else if (selectedObject === "mercury" && mercuryModel) {
          camera.setTarget(mercuryModel.position);
        } else if (selectedObject === "venus" && venusModel) {
          camera.setTarget(venusModel.position);
        }
      };

      const canvas = document.getElementById("renderCanvas");
      const engine = new BABYLON.Engine(canvas, true);

      const createScene = function () {
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color3(0, 0, 0);

        // 1. Camera quan sát xoay quanh đối tượng
        camera = new BABYLON.ArcRotateCamera(
          "camera",
          0,
          Math.PI / 3,
          25000,
          null,
          scene,
        );
        camera.attachControl(canvas, true);
        camera.maxZ = 1000000;
        camera.lowerRadiusLimit = 100;
        camera.upperRadiusLimit = 500000;
        camera.wheelDeltaPercentage = 0.05;

        // Ánh sáng môi trường nhẹ trong vũ trụ
        const ambientLight = new BABYLON.HemisphericLight(
          "ambientLight",
          new BABYLON.Vector3(0, 1, 0),
          scene,
        );
        // Màu ánh sáng từ bầu trời
        ambientLight.diffuse = new BABYLON.Color3(1, 1, 1);

        // Màu phản xạ từ mặt đất lên (giúp vùng tối có màu dịu nhẹ)
        ambientLight.groundColor = new BABYLON.Color3(0.2, 0.2, 0.2);
        ambientLight.intensity = 0.1;
        // 2. Skybox không gian vũ trụ
        const spaceSkybox = BABYLON.MeshBuilder.CreateSphere(
          "spaceSkybox",
          { segments: 32, diameter: 1000000 },
          scene,
        );
        spaceSkybox.infiniteDistance = true;

        const spaceMaterial = new BABYLON.StandardMaterial("spaceMat", scene);
        spaceMaterial.backFaceCulling = false;
        spaceMaterial.disableLighting = true;

        const spaceTexture = new BABYLON.Texture(
          "./universe_texture.png",
          scene,
          false,
          false,
          BABYLON.Texture.BILINEAR_SAMPLINGMODE,
          () => {},
          () => {
            console.log("Texture loaded error!");
          },
        );

        spaceMaterial.emissiveTexture = spaceTexture;
        spaceSkybox.material = spaceMaterial;

        // 3. Nguồn sáng điểm phát ra từ tâm Mặt Trời (0, 0, 0)
        const sunLight = new BABYLON.PointLight(
          "sunLight",
          BABYLON.Vector3.Zero(),
          scene,
        );
        sunLight.intensity = 20;
        sunLight.range = 1000000;
        sunLight.diffuse = new BABYLON.Color3(1, 1, 1);
        sunLight.specular = new BABYLON.Color3(1, 1, 1);

        // Hiệu ứng phát sáng hào quang (Bloom/Glow)
        const gl = new BABYLON.GlowLayer("glow", scene);
        gl.intensity = 0.8;

        // 4. Model Mặt Trời tại tâm (0, 0, 0)
        BABYLON.SceneLoader.ImportMesh(
          "",
          "./models/",
          "sun.glb",
          scene,
          function (meshes) {
            sunModel = meshes[0];
            sunModel.position = BABYLON.Vector3.Zero();
            sunModel.scaling = new BABYLON.Vector3(10, 10, 10);

            camera.setTarget(sunModel.position);

            // Loại trừ mesh Mặt Trời khỏi nguồn sáng
            meshes.forEach((mesh) => {
              sunLight.excludedMeshes.push(mesh);
            });
          },
        );

        // 5. Model Trái Đất
        const orbitRadius = 100000;
        let earthOrbitAngle = 0;

        BABYLON.SceneLoader.ImportMesh(
          "",
          "./models/",
          "earth.glb",
          scene,
          function (meshes) {
            earthModel = meshes[0];
            earthModel.position = new BABYLON.Vector3(orbitRadius, 0, 0);

            // Góc nghiêng trục tự nhiên của Trái Đất (~23.4 độ)
            earthModel.rotate(
              BABYLON.Axis.Z,
              BABYLON.Tools.ToRadians(23.4),
              BABYLON.Space.WORLD,
            );

            meshes.forEach((mesh) => {
              if (
                mesh.getTotalVertices &&
                mesh.getTotalVertices() > 0 &&
                mesh.material
              ) {
                const baseTexture =
                  mesh.material.albedoTexture ||
                  mesh.material.diffuseTexture ||
                  (mesh.material.getActiveTextures
                    ? mesh.material.getActiveTextures()[0]
                    : null);

                const stdMat = new BABYLON.StandardMaterial(
                  mesh.name + "_fixedMat",
                  scene,
                );

                if (baseTexture) {
                  stdMat.diffuseTexture = baseTexture;
                }

                // Cường độ phản quang bề mặt
                stdMat.diffuseColor = new BABYLON.Color3(3, 3, 3);
                stdMat.specularColor = new BABYLON.Color3(0, 0, 0);
                stdMat.specularPower = 0;
                stdMat.emissiveColor = new BABYLON.Color3(0, 0, 0);

                mesh.material = stdMat;
              }
            });
          },
        );

        BABYLON.SceneLoader.ImportMesh(
          "",
          "./models/",
          "moon.glb",
          scene,
          function (meshes) {
            moonModel = meshes[0];
            moonModel.position = new BABYLON.Vector3(orbitRadius, 0, 0);
            moonModel.scaling = new BABYLON.Vector3(0.2, 0.2, 0.2);

            meshes.forEach((mesh) => {
              if (
                mesh.getTotalVertices &&
                mesh.getTotalVertices() > 0 &&
                mesh.material
              ) {
                const baseTexture =
                  mesh.material.albedoTexture ||
                  mesh.material.diffuseTexture ||
                  (mesh.material.getActiveTextures
                    ? mesh.material.getActiveTextures()[0]
                    : null);

                const stdMat = new BABYLON.StandardMaterial(
                  mesh.name + "_fixedMat",
                  scene,
                );

                if (baseTexture) {
                  stdMat.diffuseTexture = baseTexture;
                }

                // Cường độ phản quang bề mặt
                stdMat.diffuseColor = new BABYLON.Color3(3, 3, 3);
                stdMat.specularColor = new BABYLON.Color3(0, 0, 0);
                stdMat.specularPower = 0;
                stdMat.emissiveColor = new BABYLON.Color3(0, 0, 0);

                mesh.material = stdMat;
              }
            });
          },
        );

        BABYLON.SceneLoader.ImportMesh(
          "",
          "./models/",
          "mercury.glb",
          scene,
          function (meshes) {
            mercuryModel = meshes[0];
            mercuryModel.position = new BABYLON.Vector3(
              mercuryOrbitRadius,
              0,
              0,
            );
            mercuryModel.scaling = new BABYLON.Vector3(0.38, 0.38, 0.38);

            meshes.forEach((mesh) => {
              if (
                mesh.getTotalVertices &&
                mesh.getTotalVertices() > 0 &&
                mesh.material
              ) {
                const baseTexture =
                  mesh.material.albedoTexture ||
                  mesh.material.diffuseTexture ||
                  (mesh.material.getActiveTextures
                    ? mesh.material.getActiveTextures()[0]
                    : null);

                const stdMat = new BABYLON.StandardMaterial(
                  mesh.name + "_fixedMat",
                  scene,
                );

                if (baseTexture) {
                  stdMat.diffuseTexture = baseTexture;
                }

                // Cường độ phản quang bề mặt
                stdMat.diffuseColor = new BABYLON.Color3(3, 3, 3);
                stdMat.specularColor = new BABYLON.Color3(0, 0, 0);
                stdMat.specularPower = 0;
                stdMat.emissiveColor = new BABYLON.Color3(0, 0, 0);

                mesh.material = stdMat;
              }
            });
          },
        );

        BABYLON.SceneLoader.ImportMesh(
          "",
          "./models/",
          "venus.glb",
          scene,
          function (meshes) {
            venusModel = meshes[0];
            venusModel.position = new BABYLON.Vector3(venusOrbitRadius, 0, 0);
            venusModel.scaling = new BABYLON.Vector3(0.95, 0.95, 0.95);

            meshes.forEach((mesh) => {
              if (
                mesh.getTotalVertices &&
                mesh.getTotalVertices() > 0 &&
                mesh.material
              ) {
                const baseTexture =
                  mesh.material.albedoTexture ||
                  mesh.material.diffuseTexture ||
                  (mesh.material.getActiveTextures
                    ? mesh.material.getActiveTextures()[0]
                    : null);

                const stdMat = new BABYLON.StandardMaterial(
                  mesh.name + "_fixedMat",
                  scene,
                );

                if (baseTexture) {
                  stdMat.diffuseTexture = baseTexture;
                }

                // Cường độ phản quang bề mặt
                stdMat.diffuseColor = new BABYLON.Color3(3, 3, 3);
                stdMat.specularColor = new BABYLON.Color3(0, 0, 0);
                stdMat.specularPower = 0;
                stdMat.emissiveColor = new BABYLON.Color3(0, 0, 0);

                mesh.material = stdMat;
              }
            });
          },
        );

        // ==================== CÀI ĐẶT TỐC ĐỘ GỐC MẶT TRỜI ====================
        // Gốc chuẩn cố định: Tốc độ tự quay của Mặt Trời mỗi frame
        // Tăng/giảm số này để tăng/giảm tốc độ toàn bộ hệ thống
        const SUN_SPIN_SPEED = 0.001;

        // Trái Đất tự quay quanh trục (1 ngày so với ~27 ngày của Mặt Trời -> gấp 27 lần)
        const EARTH_SPIN_SPEED = -SUN_SPIN_SPEED * 27.0;

        // Trái Đất bay quanh Mặt Trời (365.25 ngày so với 27 ngày -> chậm hơn 13.528 lần)
        const EARTH_ORBIT_SPEED = SUN_SPIN_SPEED / (365.25 / 27.0);
        // ====================================================================

        // --- PHẦN MẶT TRĂNG ---
        let moonOrbitAngle = 0;

        // Khoảng cách quỹ đạo Mặt Trăng tính theo tỉ lệ thực tế so với khoảng cách Trái Đất - Mặt Trời
        // (Khoảng cách TĐ-Mặt Trăng: ~384,400 km | TĐ-Mặt Trời: ~149,600,000 km)
        const moonOrbitRadius = orbitRadius / 50;

        // Tốc độ Mặt Trăng quay quanh Trái Đất
        // (Chu kỳ Mặt Trăng quanh TĐ là ~27.3 ngày, dùng chung hệ quy chiếu thời gian với cơ sở 27 ngày của bạn)
        const MOON_ORBIT_SPEED = SUN_SPIN_SPEED * (27.0 / 27.3);

        // Mặt Trăng tự quay quanh trục (Bị khóa thủy triều - tidal locking nên chu kỳ tự quay = chu kỳ quỹ đạo)
        const MOON_SPIN_SPEED = MOON_ORBIT_SPEED;

        let mercuryOrbitAngle = 0;

        const mercuryOrbitRadius = orbitRadius / 2.5; // Khoảng cách quỹ đạo Sao Thủy so với Trái Đất
        // Sao Thủy tự quay quanh trục (58.65 ngày so với ~27 ngày của Mặt Trời -> chậm hơn khoảng 2.17 lần)
        const MERCURY_SPIN_SPEED = -SUN_SPIN_SPEED / (58.65 / 27.0);

        // Sao Thủy bay quanh Mặt Trời (87.97 ngày so với 27 ngày của Mặt Trời)
        const MERCURY_ORBIT_SPEED = SUN_SPIN_SPEED / (87.97 / 27.0);

        // --- SAO KIM (VENUS) ---

        let venusOrbitAngle = 0;
        const venusOrbitRadius = orbitRadius / 1.5; // Khoảng cách quỹ đạo Sao Kim so với Trái Đất
        // Sao Kim tự quay ngược chiều quanh trục (243 ngày so với ~27 ngày của Mặt Trời)
        // Dùng dấu dương vì Sao Kim quay nghịch chiều (retrograde rotation) so với Trái Đất và Mặt Trời
        const VENUS_SPIN_SPEED = SUN_SPIN_SPEED / (243.0 / 27.0);

        // Sao Kim bay quanh Mặt Trời (224.7 ngày so với 27 ngày của Mặt Trời)
        const VENUS_ORBIT_SPEED = SUN_SPIN_SPEED / (224.7 / 27.0);

        // 6. Cập nhật chuyển động mỗi khung hình
        scene.registerBeforeRender(function () {
          // Xoay nhẹ nền sao vũ trụ
          spaceSkybox.rotation.y += 0.00005;

          // 1. Mặt Trời tự quay quanh trục (gốc chuẩn)
          if (sunModel) {
            sunModel.rotate(
              BABYLON.Axis.Y,
              SUN_SPIN_SPEED,
              BABYLON.Space.LOCAL,
            );
          }

          // 2. Trái Đất vận động theo tỉ lệ chuẩn từ Mặt Trời
          if (earthModel) {
            // Trái Đất tự quay quanh trục nghiêng
            earthModel.rotate(
              BABYLON.Axis.Y,
              EARTH_SPIN_SPEED,
              BABYLON.Space.LOCAL,
            );

            // Trái Đất bay trên quỹ đạo tròn quanh Mặt Trời
            earthOrbitAngle += EARTH_ORBIT_SPEED;
            earthModel.position.x = orbitRadius * Math.cos(earthOrbitAngle);
            earthModel.position.z = orbitRadius * Math.sin(earthOrbitAngle);
          }
          // 3. Mặt Trăng vận động dựa trên Trái Đất
          if (moonModel && earthModel) {
            // Mặt Trăng tự quay quanh trục
            moonModel.rotate(
              BABYLON.Axis.Y,
              MOON_SPIN_SPEED,
              BABYLON.Space.LOCAL,
            );

            // Mặt Trăng bay quanh quỹ đạo của Trái Đất
            moonOrbitAngle += MOON_ORBIT_SPEED;
            moonModel.position.x =
              earthModel.position.x +
              moonOrbitRadius * Math.cos(moonOrbitAngle);
            moonModel.position.z =
              earthModel.position.z +
              moonOrbitRadius * Math.sin(moonOrbitAngle);
            moonModel.position.y = earthModel.position.y;
          }

          if (mercuryModel) {
            // Sao Thủy tự quay quanh trục
            mercuryModel.rotate(
              BABYLON.Axis.Y,
              MERCURY_SPIN_SPEED,
              BABYLON.Space.LOCAL,
            );

            // Sao Thủy bay quanh quỹ đạo của Mặt Trời
            mercuryOrbitAngle += MERCURY_ORBIT_SPEED;
            mercuryModel.position.x =
              mercuryOrbitRadius * Math.cos(mercuryOrbitAngle);
            mercuryModel.position.z =
              mercuryOrbitRadius * Math.sin(mercuryOrbitAngle);
          }

          if (venusModel) {
            // Sao Kim tự quay quanh trục
            venusModel.rotate(
              BABYLON.Axis.Y,
              VENUS_SPIN_SPEED,
              BABYLON.Space.LOCAL,
            );

            // Sao Kim bay quanh quỹ đạo của Mặt Trời
            venusOrbitAngle += VENUS_ORBIT_SPEED;
            venusModel.position.x =
              venusOrbitRadius * Math.cos(venusOrbitAngle);
            venusModel.position.z =
              venusOrbitRadius * Math.sin(venusOrbitAngle);
          }
        });

        return scene;
      };

      const scene = createScene();

      engine.runRenderLoop(function () {
        scene.render();
      });

      window.addEventListener("resize", function () {
        engine.resize();
      });
    </script>
  </body>
</html>
